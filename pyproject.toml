# pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "src"
version = "0.1.0"
dependencies = [
    "lpips==0.1.4",
    "matplotlib==3.10.7",
    "numpy==2.3.3",
    "pandas==2.3.3",
    "pillow==11.3.0",
    "pip==24.0",
    "PyYAML==6.0.3",
    "scikit-image==0.25.2",
    "scipy==1.16.3",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "tqdm==4.67.1"
]

[tool.setuptools]
packages = ["src"]